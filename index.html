<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102534" />
    <meta name="description" content="Fares24x7 connects businesses that need trucks with transporters already on the route. Post a load, get a verified truck, and turn empty return trips into paid trips." />
    <link rel="canonical" href="https://www.fares24x7.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fares24x7" />
    <meta property="og:url" content="https://www.fares24x7.com/" />
    <meta property="og:title" content="Fares24x7 | Truck loads and return trips" />
    <meta property="og:description" content="Post a load, get a truck already heading your way. Truck owners find return loads so no truck runs empty." />
    <meta property="og:image" content="https://www.fares24x7.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Fares24x7 split-flap loader: used in index.html (first paint) and by the app (loading, logging in/out) */
      body{margin:0}
      .sf-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f7f5}
      .sf-overlay{position:fixed;inset:0;z-index:5000;min-height:0;animation:sf-fade .2s ease both}
      .sf-board{box-sizing:border-box;display:flex;align-items:flex-start;gap:5px;padding:14px;border-radius:16px;background:#151515;box-shadow:0 22px 40px -18px rgba(0,0,0,.55)}
      .sf-flap{box-sizing:border-box;flex:none;position:relative;width:clamp(24px,6.4vw,40px);height:clamp(36px,9.6vw,58px);display:grid;place-items:center;border-radius:6px;background:linear-gradient(#262626 50%,#1c1c1c 50%);color:#f5f5f2;font:700 clamp(20px,5.4vw,34px)/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
      .sf-flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0b0b0b}
      .sf-flap.flip{animation:sf-roll .09s cubic-bezier(.3,.7,.4,1)}
      .sf-flap.hot{color:#ffa51f}
      @keyframes sf-roll{from{padding-bottom:1.1em}to{padding-bottom:0}}
      @keyframes sf-fade{from{opacity:0}to{opacity:1}}
      @media (prefers-reduced-motion:reduce){.sf-flap.flip,.sf-overlay{animation:none}}
    </style>
    <title>Fares24x7 | Truck loads and return trips</title>
  </head>
  <body>
    <div id="root"><div class="sf-screen"><div class="sf-board" id="sf-boot" role="status" aria-label="loading"></div></div></div>
    <script>
      (function(){var b=document.getElementById('sf-boot');if(!b)return;var C=' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',W=['LOADING','FARES24X7'],n=9,f=[],i,k=0;
      for(i=0;i<n;i++){var s=document.createElement('span');s.className='sf-flap';s.textContent=' ';b.appendChild(s);f.push(s);}
      function show(t){var p=Math.floor((n-t.length)/2);t=(Array(p+1).join(' ')+t+'         ').slice(0,n);f.forEach(function(el,j){var st=4+Math.floor(Math.random()*4);function tick(){el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip');if(st-->0){el.textContent=C[Math.floor(Math.random()*C.length)];setTimeout(tick,60);}else{el.textContent=t[j];el.classList.toggle('hot',t.trim()==='FARES24X7'&&/[0-9X]/.test(t[j]));}}setTimeout(tick,j*40);});}
      show(W[0]);setInterval(function(){k++;show(W[k%2]);},1900);})();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
